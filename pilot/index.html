<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#17171d">
  <title>Lightning PE HQ | Staff Pilot</title>
  <link rel="icon" href="./assets/bolt.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./pilot.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="pilot-header">
    <div class="pilot-width">
      <a class="brand" href="./" aria-label="Lightning PE HQ pilot"><img src="./assets/bolt.svg" alt="" width="39" height="39"><span class="brand-copy"><strong>LIGHTNING</strong><small>PE HEADQUARTERS</small></span></a>
      <button class="btn on-dark" id="sign-out" type="button" hidden>Sign out</button>
    </div>
  </header>
  <main id="main" class="pilot-width pilot-main" tabindex="-1">
    <div id="app"><p role="status">Loading staff workspace…</p></div>
    <p id="feedback" class="pilot-message" role="status" aria-live="polite"></p>
  </main>
  <dialog id="task-dialog" aria-labelledby="pilot-dialog-title"></dialog>
</body>
</html>
